# 多平台打包 / 发布：tag `v*` → 编译 + 打包 + 发 GitHub Release；workflow_dispatch → 只构建传 artifact。
# Matrix：windows-x86_64 → zip；macos-aarch64 / linux-x86_64 / linux-aarch64 → tar.gz。
# 产物命名 so-novel-rs-<version>-<os>-<arch>.<ext>；Release 主体取 `docs/CHANGELOG.md`，
# 打 tag 前把 "\[Unreleased\]" 段改名为 "\[X.Y.Z\] - YYYY-MM-DD"。
# Linux 编译需要 gpui 的 apt dev 包（xkbcommon / xcb / wayland / gl / egl + Vulkan headers）；
# macOS / Windows 用系统 framework，无需额外包。

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建传 artifact，不发 Release"
        required: false
        default: "true"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # 不提供 macos x86_64：cross 装该 toolchain 在 Actions 上常失败，要加回来请用 `macos-13` runner。

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev \
            libglib2.0-dev libssl-dev \
            mesa-vulkan-drivers
          sudo apt-get install -y vulkan-utility-libraries-dev || true

      - name: Build (release)
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # ---- 打包：Linux 复用 scripts/package-linux.sh（HTML 模板 / logo 已由 include_*! 嵌入二进制，
      # assets/rules/ 随包携带）；macOS / Windows 在此就地打 ----
      - name: Stage artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package-linux.sh "${{ matrix.target }}"

      - name: Stage artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          STAGE: so-novel-rs-${{ steps.ver.outputs.version }}-macos-${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}
        run: |
          BIN="target/${{ matrix.target }}/release/so-novel-rs"
          mkdir -p "dist/$STAGE"
          cp "$BIN" "dist/$STAGE/"
          chmod +x "dist/$STAGE/so-novel-rs"
          cp -r assets/rules "dist/$STAGE/rules"
          ( cd dist && tar -czf "$STAGE.tar.gz" "$STAGE" )

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          STAGE: so-novel-rs-${{ steps.ver.outputs.version }}-windows-x86_64
        run: |
          BIN="target/${{ matrix.target }}/release/so-novel-rs.exe"
          mkdir -p "dist/$STAGE"
          cp "$BIN" "dist/$STAGE/"
          cp -r assets/rules "dist/$STAGE/rules"
          ( cd dist && 7z a -tzip "$STAGE.zip" "$STAGE" )

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    # tag 触发才发 Release；workflow_dispatch 只留 artifact。
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        shell: bash
        run: find dist -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # CHANGELOG.md 既是 release 主体（替代 auto-generated notes），也作为 asset 上传。
          body_path: docs/CHANGELOG.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            docs/CHANGELOG.md
          fail_on_unmatched_files: true
