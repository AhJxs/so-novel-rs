[package]
name = "so-novel-rs"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
description = "So Novel — Rust desktop client (gpui-kit 0.7)."
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "so-novel-rs"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.7.1"
# 国际化 —— 复用 gpui-kit 组件库内部用的同一套 rust-i18n 机制。
rust-i18n = "4.2.4"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# smol：gpui 的 `cx.spawn` 跑在 smol executor 上（不是 tokio），其 future 内部**不能**用
# `tokio::time::sleep` / `tokio::sync::mpsc::channel`（没有 tokio reactor，会 panic），
# 要用 smol channel + `async_cx.background_executor().timer(...)`。项目顶层只保留 gpui 一个
# runtime，避免两套 executor 共存、background task 跨线程调度难以追踪。
smol = "2"

# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
# `ansi` 必须开：否则 tracing-subscriber 不给字段名（`trace_id=` 等）加颜色码。
# `json` 给容器 / 聚合栈的 `.json()` layer 用。
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi", "json"] }

# Config / serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "1.3"
# 配置用 toml_edit 而非 toml：后者写出会丢注释和顺序，设置页写回会洗掉用户的注释 / 字段排列。
toml_edit = { version = "0.25", features = ["serde"] }

# Filesystem helpers
directories = "6"

# HTTP client（rustls 免 OpenSSL；cookies 供规则注入 Cookie 头；gzip/brotli 透明解压）。
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "cookies",
    "gzip",
    "brotli",
    "stream",
    "form",
    "query",
] }

# HTML / 选择器 / 正则
scraper = "0.27"
regex = "1"

# 编码兜底（GBK / Big5 等老站点）
encoding_rs = "0.8"
chardetng = "1"

# JavaScript 引擎（书源规则 @js: 后处理 + quanben5 加密）。
# 选 boa 而非 rquickjs：纯 Rust 无 C 工具链依赖，规则用到的 ES5/ES6 子集它都支持。
boa_engine = "0.22"

# rand（UA 池等）。惰性初始化改用 std::sync::LazyLock，不再需要 once_cell。
rand = "0.10"

# 图片解码校验：下载的封面字节在缓存前先校验是否真是有效图片，避免 UI 渲染时才 Failed。
image = "0.25"

# URL 解析与拼接（absUrl）
url = "2"

# 字符串相似度（聚合搜索结果排序，等价 Java hutool StrUtil.similar）。
strsim = "0.11"

# EPUB 生成（纯 Rust + 内置 zip）。
epub-builder = "0.8"

# zip 打包（HTML 整本下载用）。关掉 bzip2/lzma 等带 C 依赖的特性，只留 deflate，
# 减少 Windows MSVC 编译时对 cl.exe 的依赖。
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

# 原生文件选择对话框（书源管理「添加」按钮：选 JSON 文件导入）。
# 用 xdg-portal 而非默认 GTK3，避免引入 gtk3 系统依赖；它自带 pollster，
# 不再需要 ashpd / tokio runtime。AsyncFileDialog 返回 impl Future，由调用方 executor 驱动。
rfd = { version = "^0.17.2", default-features = false, features = ["xdg-portal"] }

# 读系统本地时区（UtcOffset::current_local_offset）；local-offset 在三个平台各自调 OS API。
time = { version = "0.3", default-features = false, features = ["local-offset"] }
zhconv = "0.4.1"
# 不启用 `rendering` feature：只用 pdf_oxide::writer 直接拼文本，不走 from_html_css 渲染流水线；
# `rendering` 会拉入整套 HTML/CSS 解析依赖，编译时间显著增加而无功能收益。
pdf_oxide = { version = "0.3.77" }

# LRU 缓存（`SearchState::cover_cache` 用有界 LRU 替代无界 HashMap，避免长会话累积封面字节）。
lru = "0.18"

[dev-dependencies]
tempfile = "3"
# 构造最小 PNG 验证 cover_entry_from_bytes。
image = "0.25"

# 在 Windows 上把 assets/logo.ico 嵌入 exe 资源段（build.rs 调用，仅 Windows 需要）。
[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
