# 只放阈值类参数与测试豁免；规则的 allow/warn 级别集中在 src/lib.rs，便于单点扫描。

# 测试代码允许 unwrap / expect / panic（生产代码仍由 crate 级 lint 约束）。
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# 圈复杂度上限（默认 100，收紧到 25 强制拆分长函数）
cognitive-complexity-threshold = 25

# 函数参数上限（默认 7，service 层有 8 参的解析编排）
too-many-arguments-threshold = 8

# 类型复杂度上限（默认 250，略放宽防误伤）
type-complexity-threshold = 300

# 单字符变量名阈值（默认 3，收紧防 `a/b/c` 滥用）
single-char-binding-names-threshold = 5
