      zh-CN: 添加
      zh-TW: 添加
    health_check:
      en: "Health check"
      zh-CN: 测速
      zh-TW: 測速
    delete:
      en: Delete
      zh-CN: 删除
      zh-TW: 刪除
  # 书源行内小 tag 的标签（language 已经是 rule.language 不需要翻译；
