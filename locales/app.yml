# 搜索下载页面（`src/gpui_app/pages/search.rs`）所有面向用户的字符串。
# 设计要点：
# - 选书源下拉第一项 value=""（"全部"=None），其余 "rule:{id}" 编码 source id，
#   confirm 回调里 strip_prefix 解析。"全部" label 走 Search.source.all。
# - 选章 / 全本 两个行内按钮。选章暂不实现，点击弹 info toast "功能即将推出"。
# - 全部已派下载任务反馈用 success toast（带 #N 任务 id），不阻塞 UI。
# - 行内元信息列：作者 / 最新章节，缺失时走 Search.result.unknown_* fallback。
# - 源 id badge 用 Search.result.source + t! 替换 %{id} 占位符（不能直接
#   format! 拼字符串，否则切语言后占位符翻译也跟着拼，顺序会乱）。
Search:
  page_title:
    en: "Search & Download"
    zh-CN: 搜索下载
    zh-TW: 搜尋下載
  page_subtitle:
    en: "Search by book name or author; aggregate or single-source"
    zh-CN: "按书名 / 作者搜索；支持单源或全源聚合搜索"
    zh-TW: "按書名 / 作者搜尋；支援單源或全源聚合搜尋"
  filter:
    placeholder:
      en: "Book name / author"
      zh-CN: 书名 / 作者
      zh-TW: 書名 / 作者
  source:
    # 工具栏 "书源" label —— 在 Select 前的静态文字
    label:
      en: Source
      zh-CN: 书源
      zh-TW: 書源
    # Select 第一项 "聚合搜索"（value="all" = 跨书源搜索 = None）。
    # 切语言后下次展开下拉自动更新。
    aggregate:
      en: "All sources"
      zh-CN: "聚合搜索"
      zh-TW: "聚合搜尋"
  action:
    # 工具栏右侧搜索按钮
    search:
      en: Search
      zh-CN: 搜索
      zh-TW: 搜尋
    # 行内选章按钮 label + 不可用提示 toast 消息
    select_chapters:
      en: "Select Chapters"
      zh-CN: 选章
      zh-TW: 選章
    # 行内全本按钮 label
    download_whole:
      en: "Whole Book"
      zh-CN: 全本
      zh-TW: 全本
    # 全本下载成功后的 success toast 标题
    download_started:
      en: "Download queued"
      zh-CN: "已派下载任务"
      zh-TW: "已派下載任務"
  # 选章下载 Dialog：行内"选章"按钮 → 拉 TOC → confirm Dialog 输入起止章节 → 按范围下载。
  # 用 gpui-kit 组件库的 Dialog .confirm()（OK=下载 / Cancel=取消），反应式读 toc_cache。
  range:
    # Dialog 标题
    title:
      en: "Select Chapters to Download"
      zh-CN: "选择下载章节"
      zh-TW: "選擇下載章節"
    # 起止章节输入 label
    start:
      en: Start
      zh-CN: 起始
      zh-TW: 起始
    end:
      en: End
      zh-CN: 结束
      zh-TW: 結束
    # "共 N 章" 的 N 占位符文案
    total:
      en: "%{n} chapters in total"
      zh-CN: "共 %{n} 章"
      zh-TW: "共 %{n} 章"
    # 选中范围预览行 label
    preview:
      en: Selected
      zh-CN: 选中
      zh-TW: 選中
    # TOC 还在拉的占位
    loading:
      en: "Loading chapter list…"
      zh-CN: "正在获取章节列表…"
      zh-TW: "正在取得章節列表…"
    # TOC 拉取失败
    failed:
      en: "Failed to load chapter list"
      zh-CN: "章节列表获取失败"
      zh-TW: "章節列表取得失敗"
    # 范围无效（非数字 / start>end / 超界）toast
    invalid:
      en: "Please enter a valid chapter range"
      zh-CN: "请输入有效的章节范围"
      zh-TW: "請輸入有效的章節範圍"
    # confirm Dialog 的 OK 按钮（=开始下载）
    confirm:
      en: Download
      zh-CN: 下载
      zh-TW: 下載
    # confirm Dialog 的 Cancel 按钮
    cancel:
      en: Cancel
      zh-CN: 取消
      zh-TW: 取消
    # 章节名为空时的 fallback（显示在预览里）
    no_title:
      en: "(no title)"
      zh-CN: "(无标题)"
      zh-TW: "(無標題)"
  # URL 下载入口（PageHeader「下载链接」按钮 → 输入 Dialog → 复用 range_dialog）
  url_download:
    # PageHeader 按钮 label
    button:
      en: "Download by URL"
      zh-CN: 下载链接
      zh-TW: 下載連結
    # URL 输入 Dialog 标题
    dialog_title:
      en: "Download from URL"
      zh-CN: 从链接下载
      zh-TW: 從連結下載
    # URL 输入框 placeholder
    placeholder:
      en: "Paste novel detail page URL (http/https)..."
      zh-CN: 请粘贴小说详情页链接（http/https）...
      zh-TW: 請粘貼小說詳情頁連結（http/https）...
    # 剪贴板已自动粘贴时的提示行
    auto_pasted:
      en: "✓ Auto-pasted from clipboard"
      zh-CN: "✓ 已自动粘贴剪贴板"
      zh-TW: "✓ 已自動粘貼剪貼板"
    # Dialog 内的兜底「粘贴」按钮
    paste_button:
      en: Paste
      zh-CN: 粘贴
      zh-TW: 粘貼
    # Dialog OK 按钮（=开始解析 URL）
    confirm:
      en: Resolve
      zh-CN: 解析
      zh-TW: 解析
    # Dialog Cancel 按钮
    cancel:
      en: Cancel
      zh-CN: 取消
      zh-TW: 取消
    # 未匹配到任何书源的 warning toast
    no_match:
      en: "No book source matches this URL. Check the link or enable a source on the Sources page."
      zh-CN: "未匹配到任何书源，请检查链接是否正确或在「书源」页启用对应源"
      zh-TW: "未匹配到任何書源，請檢查連結是否正確或在「書源」頁啟用對應源"
    # 匹配成功的 success toast（%{name} = 书源名）
    matched_source:
      en: "✓ Matched: %{name}"
      zh-CN: "✓ 已匹配：%{name}"
      zh-TW: "✓ 已匹配：%{name}"
  empty:
    title:
      en: "Enter a keyword to start searching"
      zh-CN: "输入关键词开始搜索"
      zh-TW: "輸入關鍵詞開始搜尋"
    subtitle:
      en: "Search by book name or author; single-source reduces network requests."
      zh-CN: "按书名或作者搜索；选单源可减少网络请求。"
      zh-TW: "按書名或作者搜尋；選單源可減少網絡請求。"
  source_status:
    # 每个源 status badge 上的"等待"标签（其他状态走原 SourceStatus::Ok/Err 文案）
    pending:
      en: Pending
      zh-CN: 等待
      zh-TW: 等待
    # "N 条" 的"条"字（Ok(n) 时拼成 "5 条"）
    format:
      en: results
      zh-CN: 条
      zh-TW: 條
  result:
    # r.author 为 None 时的 fallback
    unknown_author:
      en: "(Unknown)"
      zh-CN: "(未知作者)"
      zh-TW: "(未知作者)"
    # r.latest_chapter 为 None 时的 fallback
    no_latest:
      en: "(No latest chapter)"
      zh-CN: "(无最新章节)"
      zh-TW: "(無最新章節)"
    # 源 id badge: "源 #%{id}" —— %{id} 占位符由 t! 替换
    source:
      en: "Source #%{id}"
      zh-CN: "源 #%{id}"
      zh-TW: "源 #%{id}"
    # r.source_name 为空时的 fallback（行内书源名称列）
    unknown_source:
      en: "(Unknown source)"
      zh-CN: "(未知书源)"
      zh-TW: "(未知書源)"
  # 详情 Dialog：行内"详情"按钮 → 弹 Dialog 展示 SearchResult 全字段。
  # 用纯 Dialog（.title + .child），无 footer 按钮 —— 默认 close_button / overlay_closable /
  # keyboard(Esc) 全开，只读信息用 X / 点遮罩 / Esc 关闭即可，比塞个 OK 按钮更干净。
  detail:
    # 行内"详情"按钮 label
    action:
      en: Details
      zh-CN: 详情
      zh-TW: 詳情
    # Dialog 标题
    title:
      en: Book Details
      zh-CN: 书籍详情
      zh-TW: 書籍詳情
    # 字段为 None / 空时的 fallback
    unknown:
      en: "(unknown)"
      zh-CN: "(未知)"
      zh-TW: "(未知)"
    # 封面占位文案（封面需异步拉详情拿 cover_url 再下载，期间 / 失败 / 无封面时显示）
    cover:
      # 正在加载（detail 或封面字节还在后台跑）
      loading:
        en: "Loading cover…"
        zh-CN: "封面加载中…"
        zh-TW: "封面載入中…"
      # 下载 / 解码失败
      failed:
        en: "Cover unavailable"
        zh-CN: "封面获取失败"
        zh-TW: "封面取得失敗"
      # 书源详情里没有 cover_url
      none:
        en: "No cover"
        zh-CN: "无封面"
        zh-TW: "無封面"
    # 字段 label（左侧固定宽度列）
    field:
      book_name:
        en: Title
        zh-CN: 书名
        zh-TW: 書名
      author:
        en: Author
        zh-CN: 作者
        zh-TW: 作者
      source:
        en: Source
        zh-CN: 书源
        zh-TW: 書源
      category:
        en: Category
        zh-CN: 分类
        zh-TW: 分類
      status:
        en: Status
        zh-CN: 状态
        zh-TW: 狀態
      latest_chapter:
        en: Latest
        zh-CN: 最新章节
        zh-TW: 最新章節
      last_update:
        en: Updated
        zh-CN: 最近更新
        zh-TW: 最近更新
      intro:
        en: Intro
        zh-CN: 简介
        zh-TW: 簡介
      url:
        en: URL
        zh-CN: 链接
        zh-TW: 連結
