      zh-CN: 启用
      zh-TW: 啟用
    disabled:
      en: Disabled
      zh-CN: 禁用
      zh-TW: 停用
  stat:
    total:
      en: Total
      zh-CN: 总数
      zh-TW: 總數
    enabled:
      en: Enabled
      zh-CN: 启用
      zh-TW: 啟用
    disabled:
      en: Disabled
      zh-CN: 禁用
      zh-TW: 停用
    available:
      en: Available
      zh-CN: 可用
      zh-TW: 可用
  health:
    progress:
      en: "checked"
      zh-CN: 已检测
      zh-TW: 已偵測
    # StatusBadge 显示在书源行右侧的 4 种标签（对应 `health_status_label`）。
    not_tested:
