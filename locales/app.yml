      zh-CN: "✓ 已自动粘贴剪贴板"
      zh-TW: "✓ 已自動粘貼剪貼板"
    # Dialog 内的兜底「粘贴」按钮
    paste_button:
      en: Paste
      zh-CN: 粘贴
      zh-TW: 粘貼
    # Dialog OK 按钮（=开始解析 URL）
    confirm:
      en: Resolve
      zh-CN: 解析
      zh-TW: 解析
    # Dialog Cancel 按钮
    cancel:
      en: Cancel
      zh-CN: 取消
      zh-TW: 取消
    # 未匹配到任何书源的 warning toast
    no_match:
      en: "No book source matches this URL. Check the link or enable a source on the Sources page."
      zh-CN: "未匹配到任何书源，请检查链接是否正确或在「书源」页启用对应源"
      zh-TW: "未匹配到任何書源，請檢查連結是否正確或在「書源」頁啟用對應源"
    # 匹配成功的 success toast（%{name} = 书源名）
    matched_source:
      en: "✓ Matched: %{name}"
      zh-CN: "✓ 已匹配：%{name}"
      zh-TW: "✓ 已匹配：%{name}"
  empty:
    title:
      en: "Enter a keyword to start searching"
      zh-CN: "输入关键词开始搜索"
      zh-TW: "輸入關鍵詞開始搜尋"
    subtitle:
      en: "Search by book name or author; single-source reduces network requests."
      zh-CN: "按书名或作者搜索；选单源可减少网络请求。"
      zh-TW: "按書名或作者搜尋；選單源可減少網絡請求。"
  source_status:
    # 每个源 status badge 上的"等待"标签（其他状态走原 SourceStatus::Ok/Err 文案）
    pending:
      en: Pending
      zh-CN: 等待
      zh-TW: 等待
    # "N 条" 的"条"字（Ok(n) 时拼成 "5 条"）
    format:
      en: results
      zh-CN: 条
      zh-TW: 條
  result:
    # r.author 为 None 时的 fallback
    unknown_author:
      en: "(Unknown)"
      zh-CN: "(未知作者)"
      zh-TW: "(未知作者)"
    # r.latest_chapter 为 None 时的 fallback
    no_latest:
      en: "(No latest chapter)"
      zh-CN: "(无最新章节)"
      zh-TW: "(無最新章節)"
    # 源 id badge: "源 #%{id}" —— %{id} 占位符由 t! 替换
    source:
      en: "Source #%{id}"
      zh-CN: "源 #%{id}"
      zh-TW: "源 #%{id}"
    # r.source_name 为空时的 fallback（行内书源名称列）
    unknown_source:
      en: "(Unknown source)"
      zh-CN: "(未知书源)"
      zh-TW: "(未知書源)"
  # 详情 Dialog：行内"详情"按钮 → 弹 Dialog 展示 SearchResult 全字段。
  # 用纯 Dialog（.title + .child），无 footer 按钮 —— 默认 close_button / overlay_closable /
  # keyboard(Esc) 全开，只读信息用 X / 点遮罩 / Esc 关闭即可，比塞个 OK 按钮更干净。
  detail:
    # 行内"详情"按钮 label
    action:
      en: Details
      zh-CN: 详情
      zh-TW: 詳情
    # Dialog 标题
    title:
      en: Book Details
      zh-CN: 书籍详情
      zh-TW: 書籍詳情
    # 字段为 None / 空时的 fallback
    unknown:
      en: "(unknown)"
      zh-CN: "(未知)"
      zh-TW: "(未知)"
    # 封面占位文案（封面需异步拉详情拿 cover_url 再下载，期间 / 失败 / 无封面时显示）
    cover:
      # 正在加载（detail 或封面字节还在后台跑）
      loading:
        en: "Loading cover…"
        zh-CN: "封面加载中…"
        zh-TW: "封面載入中…"
      # 下载 / 解码失败
      failed:
        en: "Cover unavailable"
        zh-CN: "封面获取失败"
        zh-TW: "封面取得失敗"
      # 书源详情里没有 cover_url
      none:
        en: "No cover"
        zh-CN: "无封面"
        zh-TW: "無封面"
    # 字段 label（左侧固定宽度列）
    field:
      book_name:
        en: Title
        zh-CN: 书名
        zh-TW: 書名
      author:
        en: Author
        zh-CN: 作者
        zh-TW: 作者
      source:
        en: Source
        zh-CN: 书源
        zh-TW: 書源
      category:
        en: Category
        zh-CN: 分类
        zh-TW: 分類
      status:
        en: Status
        zh-CN: 状态
        zh-TW: 狀態
      latest_chapter:
        en: Latest
        zh-CN: 最新章节
        zh-TW: 最新章節
      last_update:
        en: Updated
        zh-CN: 最近更新
        zh-TW: 最近更新
      intro:
        en: Intro
        zh-CN: 简介
        zh-TW: 簡介
      url:
        en: URL
        zh-CN: 链接
        zh-TW: 連結
