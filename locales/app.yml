        en: "No cancelled downloads"
        zh-CN: 没有已取消的任务
        zh-TW: 沒有已取消的任務
      subtitle:
        en: "Cancelled downloads will be listed here."
        zh-CN: 已取消的任务会出现在这里。
        zh-TW: 已取消的任務會出現在這裡。
  # 任务卡片内的状态标签 / 按钮文案（原硬编码）
  card:
    status:
      running:
        en: Running
        zh-CN: 运行中
        zh-TW: 運行中
      completed:
        en: Completed
        zh-CN: 已完成
        zh-TW: 已完成
      failed:
        en: Failed
        zh-CN: 失败
        zh-TW: 失敗
      cancelled:
        en: Cancelled
        zh-CN: 已取消
        zh-TW: 已取消
      unknown:
        en: Unknown
        zh-CN: 未知
        zh-TW: 未知
    # "源 #%{id} · %{completed}/%{total} 章 · 失败 %{failed}" 拼接用的片段
    meta:
      chapters:
        en: "%{completed}/%{total} chapters"
        zh-CN: "%{completed}/%{total} 章"
        zh-TW: "%{completed}/%{total} 章"
      failed:
        en: "Failed %{n}"
        zh-CN: "失败 %{n}"
        zh-TW: "失敗 %{n}"
      # 下载开始时间 label（"开始: YYYY-MM-DD HH:MM"）
      started:
        en: "Started"
        zh-CN: 开始
        zh-TW: 開始
      # 时间格式化失败 / 0 时的 fallback
      time_unknown:
        en: "(unknown time)"
        zh-CN: "(未知时间)"
        zh-TW: "(未知時間)"
    # "第 %{idx} 章 — %{title}" / "原因: %{reason}" —— 失败明细 Dialog 里复用
    failure_chapter:
      en: "Chapter %{idx} — %{title}"
      zh-CN: "第 %{idx} 章 — %{title}"
      zh-TW: "第 %{idx} 章 — %{title}"
    failure_reason:
      en: "Reason: %{reason}"
      zh-CN: "原因: %{reason}"
      zh-TW: "原因: %{reason}"
    # 动作按钮
    action:
      cancel:
        en: Cancel
        zh-CN: 取消
        zh-TW: 取消
      cancelling:
        en: "Cancelling..."
        zh-CN: "正在取消..."
        zh-TW: "正在取消..."
      retry:
        en: Retry
        zh-CN: 重试
        zh-TW: 重試
      open:
        en: Open
        zh-CN: 打开
        zh-TW: 打開
      reveal:
        en: Location
        zh-CN: 位置
        zh-TW: 位置
      delete:
        en: Delete
        zh-CN: 删除
        zh-TW: 刪除
      # 失败明细按钮（%{n} = 失败章节数）—— 点击弹 Dialog 列出失败章节 + 原因。
      # 不再用行内 Accordion（List 等高 + overflow_hidden 撑不开）。
      failures:
        en: "Failed (%{n})"
        zh-CN: "失败明细 (%{n})"
        zh-TW: "失敗明細 (%{n})"
  # 失败明细 Dialog（只读列表，跟书籍详情 Dialog 同款：右上角 X 关闭 + Esc + overlay 点击）
  failures_dialog:
    # %{book_name} 占位符
    title:
      en: 'Failed chapters — "%{book_name}"'
      zh-CN: "失败章节明细——《%{book_name}》"
      zh-TW: "失敗章節明細——《%{book_name}》"
  # 无书名时的 fallback
  fallback_unknown_book:
    en: "(unknown book)"
    zh-CN: "(未知书名)"
    zh-TW: "(未知書名)"
  # 无作者时的 fallback（书名行里显示）
  fallback_unknown_author:
    en: "(unknown author)"
    zh-CN: "(未知作者)"
    zh-TW: "(未知作者)"

