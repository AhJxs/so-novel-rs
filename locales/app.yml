    all:
      en: All
      zh-CN: 全部
      zh-TW: 全部
    running:
      en: Running
      zh-CN: 运行中
      zh-TW: 運行中
    completed:
      en: Completed
      zh-CN: 已完成
      zh-TW: 已完成
    failed:
