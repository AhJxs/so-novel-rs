# rustfmt 配置。**只用 stable 选项**：CI 与本地都跑 stable `cargo fmt`，
# 不再需要 nightly toolchain。（unstable 选项会被 stable 静默忽略并刷告警，
# 那样本地与 CI 的排版结果可能不一致，2026-11-24 曾因此让 CI fmt 作业失败。）
edition = "2024"
max_width = 100
use_field_init_shorthand = true
use_try_shorthand = true

reorder_imports = true

hex_literal_case = "Lower"

# 中文注释不重排：CJK 宽度与 rustfmt 的列宽计算不稳定。
# wrap_comments = true
# comment_width = 98
# normalize_comments = false

chain_width = 60
fn_params_layout = "Tall"
