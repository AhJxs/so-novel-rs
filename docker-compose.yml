# Docker Compose — Web 模式开箱即用。
#
#   docker compose up -d
#   docker compose logs -f
#   docker compose down  # 不删卷
#
# 生产部署建议：ports 改成 "127.0.0.1:8080:8080"；前置 nginx / Caddy 做 TLS 终结
# （见 docs/WEB.md）；设 SO_NOVEL_ACCESS_CODE 启用访问码。数据在命名卷里，重建容器不丢。

services:
  so-novel:
    build:
      context: .
      dockerfile: Dockerfile
    image: so-novel:local
    container_name: so-novel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - so-novel-data:/home/so-novel/.sonovel
    environment:
      - SO_NOVEL_WEB=1
      # 调试时改 debug；想看单次爬取 trace 时改 trace
      - RUST_LOG=info,so_novel_rs=debug
    # 健康检查：命中 /api/health 端点。
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 换端口时 ports 映射与这里的 --port 要一起改。
    # command: ["so-novel-rs", "--host", "0.0.0.0", "--port", "9000"]

volumes:
  so-novel-data:
